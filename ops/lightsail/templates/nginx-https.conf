server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN_NAME__;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name __DOMAIN_NAME__;
    server_tokens off;

    ssl_certificate /etc/letsencrypt/live/__DOMAIN_NAME__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__DOMAIN_NAME__/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    root /opt/wilmas-fashion/frontend/dist;
    index index.html;
    client_max_body_size 6m;

    access_log /opt/wilmas-fashion/logs/nginx/access.log;
    error_log /opt/wilmas-fashion/logs/nginx/error.log warn;

    include /etc/nginx/snippets/wilmas-security-headers.conf;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    include /etc/nginx/snippets/wilmas-app-locations.conf;
}
