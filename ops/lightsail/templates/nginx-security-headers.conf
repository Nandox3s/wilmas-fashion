add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'; img-src 'self' data: blob: https: https://*.paypal.com https://*.paypalobjects.com; script-src 'self' https://accounts.google.com https://connect.facebook.net https://www.paypal.com https://www.sandbox.paypal.com https://*.paypal.com https://*.paypalobjects.com; style-src 'self' 'unsafe-inline' https://accounts.google.com https://fonts.googleapis.com https://*.paypal.com https://*.paypalobjects.com; font-src 'self' data: https://fonts.gstatic.com; frame-src 'self' https://accounts.google.com https://www.facebook.com https://www.paypal.com https://www.sandbox.paypal.com https://*.paypal.com https://*.paypalobjects.com; child-src 'self' https://*.paypal.com https://*.paypalobjects.com; connect-src 'self' https://accounts.google.com https://graph.facebook.com https://www.facebook.com https://www.paypal.com https://www.sandbox.paypal.com https://*.paypal.com https://*.paypalobjects.com" always;
