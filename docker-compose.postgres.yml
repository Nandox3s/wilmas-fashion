services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: wilmas
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-development-only}
      POSTGRES_DB: wilmas_fashion
    ports:
      - "5432:5432"
    volumes:
      - wilmas_postgres_data:/var/lib/postgresql/data
      - ./backend/scripts/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wilmas -d wilmas_fashion"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  wilmas_postgres_data:
