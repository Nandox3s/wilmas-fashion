name: Validate application and infrastructure

on:
  pull_request:
  push:
    branches: [main, feature/aws-migration]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: wilmas
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: wilmas_fashion_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U wilmas -d wilmas_fashion_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      NODE_ENV: test
      JWT_SECRET: test-only-ci-secret-that-is-at-least-32-characters
      DATABASE_URL: postgresql://wilmas:test-only-password@localhost:5432/wilmas_fashion_test?schema=public
      DATABASE_URL_TEST: postgresql://wilmas:test-only-password@localhost:5432/wilmas_fashion_test?schema=public
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - working-directory: backend
        run: npm ci
      - working-directory: backend
        run: npx prisma generate && npx prisma validate && npx prisma migrate deploy
      - working-directory: backend
        run: npm test
      - working-directory: backend
        run: node --check src/app.js && node --check src/server.js

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - working-directory: frontend
        run: npm ci
      - working-directory: frontend
        run: npm test && npm run build

  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - working-directory: infra/terraform
        run: terraform fmt -check -recursive
      - working-directory: infra/terraform
        run: terraform init -backend=false
      - working-directory: infra/terraform
        run: terraform validate

  deploy-placeholder:
    if: false
    needs: [backend, frontend, terraform]
    runs-on: ubuntu-latest
    environment: production
    permissions:
      id-token: write
      contents: read
    steps:
      - run: echo "Deployment remains disabled until an approved OIDC role and production approval exist."
